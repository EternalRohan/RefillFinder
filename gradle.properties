# Project-wide Gradle settings.

# Increase JVM heap space to prevent OutOfMemoryError
org.gradle.jvmargs=-Xmx2048m -Xms512m -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 -Dhttps.protocols=TLSv1.2,TLSv1.3

# Enable Gradle daemon
org.gradle.daemon=true

# Enable parallel builds for faster compile times
org.gradle.parallel=true

# Enable configuration cache for faster subsequent builds
org.gradle.configuration-cache=false

# Enable caching
org.gradle.caching=true

# AndroidX
android.useAndroidX=true

# Kotlin code style
kotlin.code.style=official

# Non-transitive R classes (recommended)
android.nonTransitiveRClass=true

# Disable file watcher performance logging warning
org.gradle.daemon.performance.disable-logging=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
